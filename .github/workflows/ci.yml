name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest scripts/ --tb=short --no-header

      - name: Validate context2html package
        run: python -c "from context2html.theme import THEME_NAMES; print(str(len(THEME_NAMES)) + ' themes loaded')"

      - name: Validate demo report
        run: python scripts/validate-report.py examples/0001-demo-report.html

      - name: Check generated artifacts are in sync
        run: |
          python scripts/sync-component-index.py --check
          python scripts/generate-theme-css.py
          git diff --exit-code theme/
