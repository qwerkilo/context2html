name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage floor
        run: >
          python -m pytest scripts/ --tb=short --no-header
          --cov=context2html --cov=scripts --cov-fail-under=90

      - name: Check Python/JS renderer parity
        run: python scripts/check-js-parity.py

      - name: Validate context2html package
        run: >-
          python -c "from context2html.theme import ThemeProvider;
          print(str(len(ThemeProvider().list_themes())) + ' themes loaded')"

      - name: Validate demo report
        run: python scripts/validate-report.py examples/0001-demo-report.html

      - name: Check generated artifacts are in sync
        run: |
          python scripts/sync-component-index.py --check
          python scripts/sync-check-table.py --check
          python scripts/generate-theme-css.py
          git diff --exit-code theme/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .

  mutation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mutation smoke (fails if a mutant survives)
        run: python scripts/mutation-smoke.py
      - name: Verify sources were restored
        run: >-
          git diff --exit-code --
          context2html runtime scripts templates theme references components
