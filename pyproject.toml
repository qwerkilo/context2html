[project]
name = "context2html"
version = "0.3.0"
description = "通用内容可视化引擎 — General-purpose content visualization engine"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["context2html*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["libs", "theme", "components", "examples", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --no-header"
